name: Build ZeescanerPro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q ./*.zip -d project
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          "$GRADLEW" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZeescanerPro-APK
          path: project/**/build/outputs/apk/**/*.apk
